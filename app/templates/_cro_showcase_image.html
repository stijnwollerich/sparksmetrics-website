{# Compact showcase — full-res source, scaled down on page #}
<div class="max-w-3xl">
  <figure class="rounded-xl border border-gray-200 shadow-md bg-white p-2 sm:p-3 {{ figure_class|default('') }}">
    <img
      src="{{ url_for('static', filename=deck ~ src) }}"
      alt="{{ alt }}"
      class="block w-full max-h-44 sm:max-h-52 md:max-h-60 object-contain object-center mx-auto"
      loading="lazy"
      decoding="async"
      width="{{ width }}"
      height="{{ height }}"
    />
  </figure>
</div>

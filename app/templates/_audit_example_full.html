{# Full-width audit example — one per row, large FigJam / board visual #}
<article class="space-y-4 md:space-y-5">
  <div class="max-w-2xl">
    {% if brand %}
    <p class="text-xs md:text-sm italic text-teal-700 mb-2">{{ brand }}</p>
    {% endif %}
    <h3 class="text-xl md:text-2xl lg:text-3xl font-display font-black text-deep-charcoal uppercase tracking-tight leading-tight">
      {{ title }}
    </h3>
    <p class="text-gray-600 text-sm md:text-base mt-3 leading-relaxed">{{ description }}</p>
  </div>
  <figure class="rounded-2xl border border-gray-200 shadow-lg bg-white overflow-hidden">
    <img
      src="{{ url_for('static', filename=deck ~ src) }}"
      alt="{{ alt }}"
      class="block w-full h-auto"
      loading="lazy"
      decoding="async"
      width="{{ width }}"
      height="{{ height }}"
    />
  </figure>
</article>
